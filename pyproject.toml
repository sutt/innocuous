[project]
name = "innocuous"
version = "0.2.4"
description = "LLM steganography: encode and decode data in generated text"
readme = "README.md"
license = {text = "MIT"}
authors = [
  {name = "Will Sutton", email = "wsutton17@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "llama-cpp-python==0.3.16",
]

[tool.uv]
# Force a source build for just this package
no-binary-package = ["llama-cpp-python"]

# Pass scikit-build-core config settings JUST for llama-cpp-python
# (Use normal TOML tables instead of multi-line inline tables.)
[tool.uv.config-settings-package]
[tool.uv."config-settings-package"."llama-cpp-python"]
"cmake.define.GGML_NATIVE" = "OFF"
"cmake.define.GGML_OPENMP" = "OFF"
"cmake.define.GGML_BLAS" = "OFF"
"cmake.define.GGML_CPU_NO_DISPATCH" = "ON"

"cmake.define.GGML_AVX" = "OFF"
"cmake.define.GGML_AVX2" = "OFF"
"cmake.define.GGML_FMA" = "OFF"
"cmake.define.GGML_F16C" = "OFF"
"cmake.define.GGML_AVX512" = "OFF"

"cmake.define.CMAKE_BUILD_TYPE" = "Release"
# "cmake.define.CMAKE_SKIP_RPATH" = "ON"
# "cmake.define.CMAKE_C_FLAGS" = "-g0 -ffloat-store -fno-unsafe-math-optimizations -ffp-contract=off"
# "cmake.define.CMAKE_CXX_FLAGS" = "-g0 -ffloat-store -fno-unsafe-math-optimizations -ffp-contract=off"
# "cmake.define.CMAKE_SHARED_LINKER_FLAGS" = "-Wl,--build-id=none"
# "cmake.define.CMAKE_MODULE_LINKER_FLAGS" = "-Wl,--build-id=none"
# "build.tool-args" = "-j1"


[tool.uv.pip]
# If you prefer to scope “no-binary” to uv pip only:
no-binary = ["llama-cpp-python"]


[project.urls]
Homepage = "https://github.com/sutt/innocuous"

[project.scripts]
innocuous = "stego_llm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stego_llm"]
ignore-vcs = true
include = [
  "stego_llm/**",
  "pyproject.toml",
  "README.md",
  "LICENSE*",
]

[tool.hatch.build.targets.sdist]
include = ["stego_llm", "pyproject.toml", "README.md", "LICENSE*"]

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "pytest>=8.4.1",
    "pytest-mock",
]
publish = [
    "build>=1.2.2",
    "twine>=6.1.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.30.1",
    "pytest>=8.4.1",
    "pytest-mock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow to run",
    "no_cleanup: do *not* run the default gc/sleep cleanup fixture fro integration tests",
]
addopts = "-m 'not slow'"
